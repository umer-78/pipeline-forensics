name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/forensics
          key: forensics-${{ hashFiles('forensics/versions.yaml') }}
      - run: pip install -e '.[dev]'
      - run: pytest -q
      # trace every version's GSM8K failures and run the injection test
      - run: python -m forensics bench
